[platformio]
default_envs = m5stack_cardputer

src_dir  = ./wled00
data_dir = ./wled00/data
build_cache_dir = ~/.buildcache

[common]
build_flags =
  -DMQTT_MAX_PACKET_SIZE=1024
  -DSECURE_CLIENT=SECURE_CLIENT_BEARSSL
  -DBEARSSL_SSL_BASIC
  -D CORE_DEBUG_LEVEL=0
  -D NDEBUG
  -Wno-attributes
  -D _IR_ENABLE_DEFAULT_=false
  -D DECODE_HASH=true
  -D DECODE_NEC=true
  -D DECODE_SONY=true
  -D DECODE_SAMSUNG=true
  -D DECODE_LG=true
  -DWLED_USE_MY_CONFIG
  -D WLED_PS_DONT_REPLACE_FX

build_unflags =

[scripts_defaults]
extra_scripts =
  pre:pio-scripts/set_metadata.py
  post:pio-scripts/output_bins.py
  post:pio-scripts/strip-floats.py
  pre:pio-scripts/user_config_copy.py
  pre:pio-scripts/load_usermods.py
  pre:pio-scripts/build_ui.py
  post:pio-scripts/validate_modules.py

[env]
framework = arduino
board_build.flash_mode = dout
monitor_speed = 115200
upload_speed = 115200
lib_compat_mode = strict
lib_deps =
    fastled/FastLED @ 3.6.0
    IRremoteESP8266 @ 2.8.2
    https://github.com/Makuna/NeoPixelBus.git#a0919d1c10696614625978dd6fb750a1317a14ce
    https://github.com/Aircoookie/ESPAsyncWebServer.git#v2.4.2
    marvinroger/AsyncMqttClient @ 0.9.0
    https://github.com/blazoncek/QuickESPNow.git#optional-debug

extra_scripts = ${scripts_defaults.extra_scripts}

[env:m5stack_cardputer]
platform = espressif32@6.4.0
board = esp32-s3-devkitc-1
framework = arduino

; Cardputer: ESP32-S3FN8 (8MB flash, NO PSRAM)
board_build.arduino.memory_type = qio_qspi
board_build.psram_type = disabled
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608

build_unflags = ${common.build_unflags}
build_flags = ${common.build_flags}
  -g
  -DESP32
  -DARDUINO_ARCH_ESP32
  -DARDUINO_ARCH_ESP32S3
  -DCONFIG_IDF_TARGET_ESP32S3=1
  -DARDUINO_USB_MSC_ON_BOOT=0
  -DARDUINO_DFU_ON_BOOT=0
  -D WLED_RELEASE_NAME='"Cardputer"'
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
  -D WLED_WATCHDOG_TIMEOUT=0
  -D CONFIG_ASYNC_TCP_USE_WDT=0
  -D CONFIG_ASYNC_TCP_STACK_SIZE=8192
  -D WLED_ENABLE_DMX_INPUT
  -D WLED_ENABLE_GIF
  ; StampS3 onboard LED is on GPIO 21
  -D DATA_PINS=21
  ; LVGL configuration
  -D LV_CONF_INCLUDE_SIMPLE
  -I usermods/Cardputer_Display

lib_deps =
  ${env.lib_deps}
  esp32async/AsyncTCP @ 3.4.7
  bitbank2/AnimatedGIF@^1.4.7
  https://github.com/Aircoookie/GifDecoder.git#bc3af189b6b1e06946569f6b4287f0b79a860f8e
  https://github.com/someweisguy/esp_dmx.git#47db25d8c515e76fabcf5fc5ab0b786f98eeade0
  m5stack/M5GFX @ ^0.3.0
  m5stack/M5Unified @ ^0.3.0
  m5stack/M5Cardputer @ ^1.0.2
  lvgl=https://github.com/lvgl/lvgl#v9.1.0

custom_usermods = Cardputer_Display

board_build.partitions = tools/WLED_ESP32_8MB.csv
board_build.f_flash = 80000000L
board_build.flash_mode = qio

upload_speed = 460800
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
